<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AdaMAST taxonomy field guide</title>
  <style>
    :root {
      --canvas: #eef2f8;
      --paper: #fbfcff;
      --ink: #17223c;
      --muted: #64708a;
      --line: #d9e0ec;
      --blue: #3158d8;
      --blue-soft: #e8edff;
      --a: #d95d45;
      --a-soft: #fff0ec;
      --b: #3274b9;
      --b-soft: #eaf5ff;
      --c: #547f5a;
      --c-soft: #edf7ee;
      --other: #7a6a98;
      --other-soft: #f4effb;
      --shadow: 0 18px 54px rgba(42, 59, 96, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--canvas);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 300px;
      background:
        linear-gradient(90deg, rgba(49, 88, 216, 0.055) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(rgba(49, 88, 216, 0.04) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--canvas);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(1380px, calc(100% - 40px));
      margin: 28px auto 64px;
    }

    .masthead {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      min-height: 270px;
      background: var(--paper);
      border: 1px solid rgba(23, 34, 60, 0.10);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .masthead::after {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      right: -160px;
      top: -170px;
      border: 58px solid var(--blue-soft);
      border-radius: 50%;
      pointer-events: none;
    }

    .spine {
      display: grid;
      align-content: space-between;
      padding: 24px 0;
      background: var(--ink);
      color: white;
      text-align: center;
    }

    .spine-mark {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      writing-mode: vertical-rl;
      justify-self: center;
      opacity: 0.72;
    }

    .spine-categories {
      display: grid;
      gap: 8px;
      justify-content: center;
    }

    .spine-categories span {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 50%;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .hero {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: space-between;
      gap: 38px;
      padding: 34px 42px 32px;
    }

    .brandline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand::before {
      content: "";
      width: 28px;
      height: 4px;
      border-radius: 8px;
      background: var(--blue);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #2347ba;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.review {
      color: #9b431f;
      background: #fff0e8;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 980px;
      margin-bottom: 12px;
      font-family: "Aptos Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
      font-size: clamp(38px, 5.2vw, 72px);
      line-height: 0.98;
      font-weight: 740;
      letter-spacing: -0.045em;
    }

    .summary {
      max-width: 820px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 26px;
      color: var(--muted);
      font-size: 13px;
    }

    .facts strong {
      color: var(--ink);
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(230px, 0.36fr) minmax(0, 1fr);
      gap: 20px;
      margin-top: 20px;
      align-items: start;
    }

    .panel {
      background: rgba(251, 252, 255, 0.96);
      border: 1px solid rgba(23, 34, 60, 0.10);
      border-radius: var(--radius);
      box-shadow: 0 10px 35px rgba(42, 59, 96, 0.07);
    }

    .sidebar {
      position: sticky;
      top: 20px;
      padding: 22px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 8px;
      color: var(--blue);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .sidebar h2 {
      margin-bottom: 18px;
      font-size: 24px;
      letter-spacing: -0.025em;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 22px;
    }

    .metric {
      padding: 13px;
      border-radius: 12px;
      background: #f1f4fa;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 5px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 18px;
    }

    .filter-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .search {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      color: var(--ink);
      background: white;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(49, 88, 216, 0.13);
    }

    .categories {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .category {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }

    .category:hover { background: #f1f4fa; }

    .category.active {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: #cdd8ff;
    }

    .category b {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }

    .category span {
      color: var(--muted);
      font-size: 12px;
    }

    .catalog { padding: 28px; }

    .catalog-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .catalog-heading h2 {
      margin-bottom: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .result-count {
      color: var(--muted);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }

    .code-list { display: grid; gap: 10px; }

    .code {
      --category-color: var(--other);
      --category-soft: var(--other-soft);
      position: relative;
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .code:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--category-color) 45%, var(--line));
      box-shadow: 0 10px 28px rgba(42, 59, 96, 0.08);
    }

    .code[data-category="A"] { --category-color: var(--a); --category-soft: var(--a-soft); }
    .code[data-category="B"] { --category-color: var(--b); --category-soft: var(--b-soft); }
    .code[data-category="C"] { --category-color: var(--c); --category-soft: var(--c-soft); }

    .code-rail {
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 18px 12px;
      background: var(--category-soft);
      border-right: 1px solid color-mix(in srgb, var(--category-color) 24%, white);
    }

    .category-letter {
      color: var(--category-color);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .code-id {
      color: var(--category-color);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .code-body { padding: 18px 20px 19px; }

    .code-body h3 {
      margin-bottom: 7px;
      font-size: 18px;
      line-height: 1.28;
      letter-spacing: -0.018em;
    }

    .code-body p {
      margin-bottom: 0;
      color: #536078;
      font-size: 14px;
      line-height: 1.58;
    }

    details {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--line);
    }

    summary {
      color: var(--category-color);
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
    }

    .extra-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .extra {
      display: grid;
      grid-template-columns: minmax(90px, 0.25fr) minmax(0, 1fr);
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .extra b { color: var(--ink); }
    .extra code { white-space: pre-wrap; overflow-wrap: anywhere; }

    .empty {
      padding: 70px 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 14px;
    }

    .footer {
      padding: 22px 4px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .shell { width: min(100% - 20px, 1380px); margin-top: 10px; }
      .masthead { grid-template-columns: 54px minmax(0, 1fr); border-radius: 18px; }
      .spine-categories span { width: 28px; height: 28px; }
      .hero { padding: 24px 22px; }
      .brandline { align-items: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .catalog { padding: 20px 14px; }
    }

    @media (max-width: 520px) {
      h1 { font-size: 37px; }
      .status { align-self: flex-start; }
      .brandline { flex-direction: column; }
      .facts { display: grid; gap: 7px; }
      .code { grid-template-columns: 66px minmax(0, 1fr); }
      .code-body { padding: 16px 14px; }
      .extra { grid-template-columns: 1fr; gap: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .code { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="spine" aria-hidden="true">
        <span class="spine-mark">FAILURE FIELD GUIDE</span>
        <div class="spine-categories"><span>A</span><span>B</span><span>C</span></div>
      </div>
      <div class="hero">
        <div class="brandline">
          <div class="brand">AdaMAST · BASELINE</div>
          <div class="status" id="status">Generated</div>
        </div>
        <div>
          <h1 id="title">Generated failure taxonomy</h1>
          <p class="summary" id="summary"></p>
        </div>
        <div class="facts" id="facts"></div>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel sidebar">
        <span class="eyebrow">Taxonomy index</span>
        <h2>Navigate codes</h2>
        <div class="metrics" id="metrics"></div>
        <label class="filter-label" for="search">Search the field guide</label>
        <input class="search" id="search" type="search" placeholder="ID, name, or description">
        <div class="categories" id="categories" aria-label="Filter by category"></div>
      </aside>

      <section class="panel catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <div>
            <span class="eyebrow">Failure modes</span>
            <h2 id="catalog-title">Code catalog</h2>
          </div>
          <div class="result-count" id="result-count"></div>
        </div>
        <div class="code-list" id="code-list"></div>
        <div class="empty" id="empty" hidden>No codes match this filter.</div>
      </section>
    </main>
    <footer class="footer">Read-only local artifact · no runtime state or activation controls</footer>
  </div>

  <script type="application/json" id="adamast-payload">{"taxonomy": {"schema_version": 1, "strategy": "baseline", "status": "review_required", "display_name": "{'name': 'Fact Verification with Multi-Hop Retrieval', 'content_type': 'Claim verification summaries and reasoning over Wikipedia passages', 'task_complexity': 'Requires tracing complex multi-entity relationships across multiple retrieval hops, identifying missing evidence, and determining when passages are insufficient for verification'} failure taxonomy", "domain": "{'name': 'Fact Verification with Multi-Hop Retrieval', 'content_type': 'Claim verification summaries and reasoning over Wikipedia passages', 'task_complexity': 'Requires tracing complex multi-entity relationships across multiple retrieval hops, identifying missing evidence, and determining when passages are insufficient for verification'}", "summary": "Failure modes generated and agreement-checked from 60 traces.", "codes": [{"id": "A.1", "name": "Execution_Timeout", "description": "Agent execution exceeded allocated time limit and was forcibly terminated before task completion.", "category": "A", "severity": "critical", "when_to_use": "When agent process is killed or stopped due to exceeding time constraints, regardless of task progress.", "when_not_to_use": "When agent completes execution within time limits but produces incomplete output for other reasons (use A.5)."}, {"id": "A.10", "name": "Multi_Hop_Context_Degradation", "description": "Agent loses track of information, reasoning chains, or evidence from earlier retrieval iterations as the multi-hop loop progresses, failing to maintain coherent connections across the full reasoning trajectory.", "category": "A", "severity": "major", "when_to_use": "When agent demonstrates awareness of early-stage information initially but progressively loses connection to it in later iterations of a multi-hop retrieval task.", "when_not_to_use": "When information loss happens immediately (use A.7). When context overflow prevents initial processing (use A.2). When single-hop task shows no multi-iteration component."}, {"id": "A.11", "name": "Insufficient_Retrieved_Evidence", "description": "External retrieval system provides passages that are insufficient in quantity, relevance, or quality, or fails to retrieve critical evidence needed for claim verification, through no fault of the agent.", "category": "A", "severity": "critical", "when_to_use": "When the root cause of failure is poor retrieval quality, not agent processing. The agent cannot succeed because necessary evidence was never provided by upstream retrieval.", "when_not_to_use": "When relevant evidence was retrieved but agent failed to use it (use A.7 or appropriate B/C code). When agent's poor query generation caused bad retrieval (use B code)."}, {"id": "A.2", "name": "Resource_Exhaustion", "description": "Agent exceeded available computational resources (memory, context window, or processing capacity), causing execution failure or information loss.", "category": "A", "severity": "critical", "when_to_use": "When agent fails due to insufficient memory, context capacity overflow, or other resource constraints that prevent normal processing.", "when_not_to_use": "When agent completes execution but output is truncated for token generation limits (use A.5). When timeout occurs without resource exhaustion (use A.1)."}, {"id": "A.3", "name": "Generic_Execution_Error", "description": "Agent encountered an unspecified system-level error during execution that prevented normal task completion.", "category": "A", "severity": "major", "when_to_use": "When agent fails due to infrastructure issues, runtime errors, or system problems that don't fit other specific categories.", "when_not_to_use": "When failure has a specific identifiable cause covered by other codes (timeout, memory, parsing, etc.)."}, {"id": "A.4", "name": "Task_Refusal", "description": "Agent explicitly declined to perform the assigned task, abandoned the task prematurely, or refused to provide required output.", "category": "A", "severity": "major", "when_to_use": "When agent consciously chooses not to complete the task, states it cannot or will not perform the work, or exits before completion by design rather than error.", "when_not_to_use": "When agent attempts the task but fails due to technical limitations (use appropriate technical failure code)."}, {"id": "A.5", "name": "Output_Truncation", "description": "Agent output was cut off during generation due to token limits or generation constraints, resulting in incomplete, partial, or entirely missing deliverables.", "category": "A", "severity": "major", "when_to_use": "When output generation stops prematurely due to length limits, producing incomplete content ranging from partial responses to completely empty output.", "when_not_to_use": "When output is complete but wrong (use B/C codes). When truncation is due to timeout (use A.1) or resource exhaustion (use A.2)."}, {"id": "A.6", "name": "Repetitive_Output_Loop", "description": "Agent produces repetitive content, circularly restating the same information without progressing toward task completion.", "category": "A", "severity": "major", "when_to_use": "When output contains redundant cycles of the same content, phrases, or reasoning steps that don't advance task objectives.", "when_not_to_use": "When repetition is intentional for emphasis or summary purposes. When agent is iterating through different items (not repeating same item)."}, {"id": "A.7", "name": "Upstream_Information_Loss", "description": "Critical information from upstream sources (retrieval system, instructions, or prior processing stages) failed to reach, be processed, or be retained by the agent during task execution.", "category": "A", "severity": "major", "when_to_use": "When essential input information is available in the pipeline but doesn't manifest in agent processing, reasoning, or output despite being necessary for task completion.", "when_not_to_use": "When information is genuinely absent from retrieval (use A.16). When loss is due to context overflow (use A.2). When loss occurs gradually in multi-hop reasoning (use A.11)."}, {"id": "A.8", "name": "Downstream_Handoff_Failure", "description": "Agent output lacks critical information, proper structure, or necessary formatting required by downstream systems (retrieval loops, parsers, or next-stage agents) to continue processing, breaking the task pipeline.", "category": "A", "severity": "critical", "when_to_use": "When agent produces output that cannot be successfully consumed by the next stage of processing, whether due to missing content, structural problems, or format violations.", "when_not_to_use": "When output is structurally valid but semantically incorrect (use B/C codes). When truncation prevents completion (use A.5 as root cause)."}, {"id": "A.9", "name": "Inconsistent_Instruction_Set", "description": "Agent receives significantly different instruction sets, prompts, or configurations across task instances, causing unpredictable behavior, variable output quality, or incomplete analysis due to guidance variability.", "category": "A", "severity": "major", "when_to_use": "When the same agent role receives different instructions for similar tasks, creating systematic inconsistency in how tasks are approached or evaluated.", "when_not_to_use": "When instruction variation is intentional for different task types. When inconsistency is in agent behavior rather than instructions received (use appropriate B/C code)."}, {"id": "B.1", "name": "Coordinator_Unclear_Task_Specification", "description": "Coordinator provides ambiguous, inconsistent, or incomplete task specifications that prevent precise execution. This includes varying instructions across invocations, ambiguous references, unclear entity boundaries, vague phrasing, or incomplete requirement statements.", "category": "B", "severity": "major", "when_to_use": "When the coordinator's task specification or claim presentation lacks the clarity needed for systematic verification", "when_not_to_use": "When the coordinator provides clear specifications but other components fail to execute properly", "applies_to_role": "coordinator"}, {"id": "B.2", "name": "Solver_Insufficient_Evidence_Analysis", "description": "Solver produces a verification conclusion without thoroughly analyzing whether provided passages contain sufficient evidence. This includes failing to identify missing evidence, not recognizing evidence gaps, or not explicitly stating when passages lack critical information needed for claim verification.", "category": "B", "severity": "critical", "when_to_use": "When solver concludes verification without adequately assessing evidence completeness or identifying what information is missing", "when_not_to_use": "When solver correctly identifies evidence gaps but coordinator fails to act on that identification", "applies_to_role": "solver"}, {"id": "B.3", "name": "Solver_Premature_Verification_Conclusion", "description": "Solver renders definitive verification verdict (SUPPORTS/REFUTES) despite having incomplete evidence that cannot establish all claim components. This includes cases where only a subset of claim components are verified while other parts remain unaddressed or unverified.", "category": "B", "severity": "critical", "when_to_use": "When solver provides definitive verdict without complete evidence coverage of all claim elements", "when_not_to_use": "When solver appropriately indicates uncertainty or insufficient evidence (use B.2 instead)", "applies_to_role": "solver"}, {"id": "B.4", "name": "Coordinator_Compound_Claim_Without_Decomposition", "description": "Coordinator provides multi-part claim requiring verification of multiple independent facts but does not structure it to guide systematic decomposition or verification of each component.", "category": "B", "severity": "major", "when_to_use": "When coordinator presents complex claims without rity": "critical", "when_to_use": "When reasoning contains logical fallacies, contradictory statements, invalid inference steps, or fails to properly construct the reasoning chain from evidence to conclusion despite having sufficient passages.", "when_not_to_use": "When evidence is insufficient (use Solver_B.1). This is about incorrect logical processing of available evidence, not missing evidence.", "applies_to_role": "solver"}, {"id": "C.5", "name": "Work_Author_Attribution_Confusion", "description": "Confusion between a creative work and its creator, such as treating a book title as an author name or vice versa. This includes treating 'author of X' as equivalent to 'X the author'.", "category": "C", "severity": "major", "when_to_use": "When reasoning treats a work title (book, film, novel) as a person or treats an author as the work itself.", "when_not_to_use": "When the work-creator relationship is correctly understood even if other errors exist."}, {"id": "C.6", "name": "Temporal_Calculation_Error", "description": "Incorrect calculation or comparison of dates, time periods, or temporal relationships. This includes arithmetic errors in computing year differences, incorrect direction of 'before/after' relationships, or wrong ordering of events.", "category": "C", "severity": "major", "when_to_use": "When reasoning performs explicit date arithmetic or temporal comparisons that are mathematically incorrect.", "when_not_to_use": "When temporal information is missing from passages (that's C.4) rather than miscalculated."}, {"id": "C.7", "name": "Entity_Coreference_Error", "description": "Failure to correctly identify when different references, descriptions, or mentions refer to the same entity (under-merging), or incorrectly treating distinct entities as the same (over-merging). This includes failures in resolving pronouns, aliases, abbreviated names, descriptive references, or contextual mentions to their referent entities.", "category": "C", "severity": "major", "w   <script>
    (() => {
      const payload = JSON.parse(document.getElementById("adamast-payload").textContent);
      const taxonomy = payload.taxonomy || {};
      const manifest = payload.manifest || {};
      const codes = Array.isArray(taxonomy.codes) ? taxonomy.codes : [];
      const acceptance = manifest.acceptance || {};
      const state = { query: "", category: "all" };

      const byId = (id) => document.getElementById(id);
      const text = (value, fallback = "") => value === undefined || value === null ? fallback : String(value);
      const displayNumber = (value) => {
        const number = Number(value);
        return Number.isFinite(number) ? number.toFixed(2) : "—";
      };

      const status = text(taxonomy.status || manifest.status, "generated");
      const statusNode = byId("status");
      statusNode.textContent = status.replaceAll("_", " ");
      if (status !== "accepted") statusNode.classList.add("review");

      byId("title").textContent = text(taxonomy.display_name, "Generated failure taxonomy");
      byId("summary").textContent = text(
        taxonomy.summary,
        "A read-only field guide to the generated failure modes."
      );

      const facts = [
        ["Domain", taxonomy.domain || "Not specified"],
        ["Strategy", taxonomy.strategy || manifest.strategy || "baseline"],
        ["Schema", taxonomy.schema_version || "1"],
        ["Provider", taxonomy.generation?.provider || manifest.request?.provider || "Not recorded"],
        ["Model", taxonomy.generation?.model || manifest.request?.model || "Not recorded"]
      ];
      for (const [label, value] of facts) {
        const item = document.createElement("span");
        const strong = document.createElement("strong");
        strong.textContent = `${label}: `;
        item.append(strong, document.createTextNode(text(value)));
        byId("facts").append(item);
      }

      const categoryCounts = codes.reduce((result, code) => {
        const category = text(code.category, "Other").toUpperCase();
        result[category] = (result[category] || 0) + 1;
        return result;
      }, {});

      const metricValues = [
        ["Codes", codes.length],
        ["Categories", Object.keys(categoryCounts).length],
        ["Fleiss κ", displayNumber(acceptance.final_kappa ?? taxonomy.generation?.agreement?.final_kappa)],
        ["Coverage", displayNumber(acceptance.final_coverage ?? taxonomy.generation?.agreement?.final_coverage)]
      ];
      for (const [label, value] of metricValues) {
        const metric = document.createElement("div");
        metric.className = "metric";
        const caption = document.createElement("span");
        caption.textContent = label;
        const number = document.createElement("strong");
        number.textContent = text(value);
        metric.append(caption, number);
        byId("metrics").append(metric);
      }

      const categoryEntries = [
        ["all", "All codes", codes.length],
        ...Object.entries(categoryCounts).sort(([a], [b]) => a.localeCompare(b))
          .map(([category, count]) => [category, `Category ${category}`, count])
      ];
      for (const [value, label, count] of categoryEntries) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `category${value === "all" ? " active" : ""}`;
        button.dataset.category = value;
        const name = document.createElement("b");
        name.textContent = label;
        const number = document.createElement("span");
        number.textContent = count;
        button.append(name, number);
        button.addEventListener("click", () => {
          state.category = value;
          document.querySelectorAll(".category").forEach((node) => {
            node.classList.toggle("active", node.dataset.category === value);
          });
          renderCodes();
        });
        byId("categories").append(button);
      }

      byId("search").addEventListener("input", (event) => {
        state.query = event.target.value.trim().toLocaleLowerCase();
        renderCodes();
      });

      function renderCodes() {
        const list = byId("code-list");
        list.replaceChildren();
        const visible = codes.filter((code) => {
          const category = text(code.category, "Other").toUpperCase();
          const categoryMatch = state.category === "all" || category === state.category;
          const haystack = [code.id, code.name, code.description, category]
            .map((value) => text(value).toLocaleLowerCase()).join(" ");
          return categoryMatch && (!state.query || haystack.includes(state.query));
        });

        byId("result-count").textContent = `${visible.length} of ${codes.length} codes`;
        byId("empty").hidden = visible.length !== 0;
        for (const code of visible) list.append(renderCode(code));
      }

      function renderCode(code) {
        const category = text(code.category, "Other").toUpperCase();
        const article = document.createElement("article");
        article.className = "code";
        article.dataset.category = category;

        const rail = document.createElement("div");
        rail.className = "code-rail";
        const letter = document.createElement("div");
        letter.className = "category-letter";
        letter.textContent = category;
        const codeId = document.createElement("div");
        codeId.className = "code-id";
        codeId.textContent = text(code.id, "—");
        rail.append(letter, codeId);

        const body = document.createElement("div");
        body.className = "code-body";
        const heading = document.createElement("h3");
        heading.textContent = text(code.name, "Unnamed failure mode");
        const description = document.createElement("p");
        description.textContent = text(code.description, "No description supplied.");
        body.append(heading, description);

        const primary = new Set(["id", "name", "description", "category"]);
        const extras = Object.entries(code).filter(([key, value]) => (
          !primary.has(key) && value !== null && value !== "" &&
          !(Array.isArray(value) && value.length === 0)
        ));
        if (extras.length) {
          const details = document.createElement("details");
          const summary = document.createElement("summary");
          summary.textContent = "Definition guidance";
          const grid = document.createElement("div");
          grid.className = "extra-grid";
          for (const [key, value] of extras) {
            const row = document.createElement("div");
            row.className = "extra";
            const label = document.createElement("b");
            label.textContent = key.replaceAll("_", " ");
            const content = document.createElement("code");
            content.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
            row.append(label, content);
            grid.append(row);
          }
          details.append(summary, grid);
          body.append(details);
        }

        article.append(rail, body);
        return article;
      }

      renderCodes();
    })();
  </script>
</body>
</html>
