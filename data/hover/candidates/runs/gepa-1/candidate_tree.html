 claim to the concrete entities in the summary. Then, output your optimized keyword search string in the `query` field.", "create_query_hop3.predict": "Given the fields `claim`, `summary_1`, `summary_2`, produce the fields `query`.", "summarize1.predict": "Given the fields `claim`, `passages`, produce the fields `summary`.", "summarize2.predict": "Given the fields `claim`, `context`, `passages`, produce the fields `reasoning` and `summary`.\n\n**Task Description:**\nYou are a reasoning assistant for a fact-checking pipeline tasked with verifying complex claims. For each task, you are provided with a `claim`, some preliminary `context`, and a list of retrieved `passages`. Your goal is to establish a logical connection between the entities in the claim by formulating a complete three-hop reasoning trajectory. Crucially, your generated output must explicitly state every intermediate bridge entity and required evidence document needed to connect the subjects, ensuring that downstream systems can successfully retrieve every necessary document.\n\n**Generalizable Strategy:**\n1. **Analyze the Claim:** Identify the core subjects and entities mentioned in the `claim`.\n2. **Identify Bridge Entities:** Determine the intermediate entities (e.g., specific locations, actors, related films, broader taxonomic classifications) that logically connect the subjects in a three-hop trajectory. \n3. **Utilize Internal Knowledge:** If the provided `context` or `passages` lack the missing links (e.g., they don't explicitly name a specific actor or a related movie title), do not simply state that the sources are insufficient. You must rely on your internal knowledge to deduce the missing bridge entities and include them.\n4. **Explicit Inclusion:** In both your `reasoning` and `summary`, explicitly name all required evidence documents and key entities (e.g., exact geographic locations, full names of people, precise film names) to ensure they are successfully captured by the retrieval trajectory.\n\n**Domain-Specific Factual Information (for future reference):**\n- The shipwreck *SS Ellan Vannin (1883)* was lost in a storm in *Liverpool Bay*.\n- Wales's first offshore wind farm is the *North Hoyle Offshore Wind Farm*, which is also situated in *Liverpool Bay*.\n- The plant species named after *David Bowman (botanist)* is *Dieffenbachia bowmanii*, which belongs to the genus *Dieffenbachia* (a flowering plant).\n- *Carlina* is a genus of flowering plants.\n- The actor who starred in the thriller *400 Boys* is *Charlie Rowe*.\n- The film adaptation based on the novel \"Northern Lights\" is the *Golden Compass film* (*The Golden Compass*)."}},

ptions in the claim to the concrete entities in the summary. Then, output your optimized keyword search string in the `query` field.", "create_query_hop3.predict": "Given the fields `claim`, `summary_1`, `summary_2`, produce the fields `query`.", "summarize1.predict": "Given the fields `claim` and `passages`, produce the fields `reasoning` and `summary`.\n\nYour objective is to verify the claim by establishing a complete three-hop retrieval trajectory that finds every required evidence document necessary to evaluate the claim.\n\nGeneralizable Strategy:\n1. **Analyze the Claim**: Break the claim down into three logical evaluation steps (hops). \n2. **Identify Required Documents**: Determine the exact three required evidence documents (e.g., entity names or article titles) needed to complete this three-hop retrieval trajectory.\n3. **Evaluate Passages**: Compare your required trajectory documents against the provided `passages`. \n4. **Reasoning Field**: Detail your step-by-step thought process. You must explicitly list which documents are \"Retrieved required evidence documents\" (present in the passages) and which are \"Missing required evidence documents\" (absent). Explain how the retrieved passages support or refute the claim. Do not rely on internal knowledge to fill in factual gaps if a required document is missing.\n5. **Summary Field**: Provide a concise conclusion about the claim's validity (e.g., true, false, supported, or lacking sufficient evidence due to specific missing documents).\n\nNiche and Domain-Specific Factual Information (for reference):\n- For claims regarding DMAX (engines) and its geographical relation to the Cincinnati metropolitan area, the required three-hop trajectory documents are: `['cincinnati metropolitan area', 'moraine ohio', 'dmax engines']`.\n- For claims regarding the inspiration for Moe Greene in \"The Godfather\" and their association with Hyman Martin, the required three-hop trajectory documents are: `['hyman martin', 'moe dalitz', 'moe greene']`.\n- For claims regarding Keightley Way connecting to a Muslim place of worship in a territory where the British monarch is head of state, the required three-hop trajectory documents are: `['ibrahimalibrahim mosque', 'keightley way', 'british overseas territories']`.", "summarize2.predict": "Given the fields `claim`, `context`, and `passages`, produce the fields `reasoning` and `summary`.\n\nYour task is to evaluate whether the provided passages contain sufficient evidence to fully verify the claim and to explicitly manage a three-hop retrieval trajectory. Complex claims often require linking three distinct entities (a three-hop reasoning chain) to be completely fact-checked.\n\n**Generalizable Strategy:**\n1. **Deconstruct the Claim:** Break down the `claim` into a three-hop reasoning chain. Determine the exact three required evidence documents needed to prove every specific detail of the claim.\n2. **Evaluate Retrieved Documents:** Review the provided `passages` to determine which of the required evidence documents have already been successfully retrieved.\n3. **Identify Missing Documents:** Pinpoint the exact missing required evidence documents needed to complete the verification. Missing documents typically fall into these categories:\n   - **Bridge Entities:** A specific entity connecting two known subjects (e.g., a specific TV show connecting a writer and a cast member).\n   - **Attribute Verification:** A subject's specific page needed to verify their personal traits (e.g., an actor's individual page is required to verify their nationality, even if their movie role is confirmed on the movie's page).\n   - **Predecessor/Successor Entities:** A related entity needed to verify historical or physical attributes (e.g., a replaced highway's page is required to verify its length and junctions).\n\n**Domain-Specific Factual Information & Edge Cases:**\n- For claims linking writer/producer Simon Blackwell to a show with a character named \"Amber\" played by a BAFTA-winning actress from \"The IT Crowd\" (Katherine Parkinson), the missing bridge document is \"Old Guys\".\n- When verifying claims about an actor's background, such as \"English actor Gary Oldman\" starring in a 1995 film by Cinergi Pictures, do not solely rely on the film's or production company's documents. You must explicitly identify \"Gary Oldman\" as a missing required evidence document to verify his English nationality.\n- Be cautious of geographic disambiguation and entity replacement. For a claim stating the road replaced by Interstate 39 (which is US Route 51) has a junction at Cairo Junction and is over 1200 miles long: the required documents are \"Interstate 39\", \"Cairo Junction Illinois\" (do not confuse with the Cairo, Oregon found in some passages), and the missing document is \"US Route 51\".\n\n**Output Format:**\n\nIn the `reasoning` field:\n- Analyze the claim step-by-step.\n- Explicitly state: \"Retrieved required evidence documents: [...]\" based on what is useful in the provided passages.\n- Explicitly state: \"Missing required evidence documents: [...]\" to instruct the three-hop retrieval trajectory on what to find next.\n- Explain why the missing document is necessary for full verification.\n\nIn the `summary` field:\n- Concisely state whether the claim is currently supported or unsupported based *only* on the provided passages.\n- Clearly mention the missing evidence documents that are required to complete the three-hop retrieval trajectory."}},
{"idx": 17, "score": 0.62, "parents": "6", "role": "", "components": {"create_query_hop2.predict": "You are an AI assistant operating within a multi-hop fact-checking system. Your task is to generate a search query to retrieve evidence documents necessary to verify a given claim. \n\nYou will be provided with the following inputs:\n- `claim`: A factual claim that requires a three-hop retrieval trajectory to fully verify.\n- `summary_1`: A summary of the information and evidence documents that have already been retrieved in the first hop.\n\nGiven the fields `claim` and `summary_1`, produce the fields `reasoning` and `query`.\n\n### Guidelines & Strategies for Success:\n1. **Identify the Missing Evidence:** Compare `claim` with `summary_1` to determine what entities, facts, or relationships are still missing. Your generated query must bridge this gap to help the system retrieve the remaining required evidence documents in the next hop.\n2. **Beware of Distractors or Incomplete Information:** Do not blindly trust that an entity mentioned in `summary_1` (e.g., \"Paula Patton\" or \"Trent Reznor\") is the only or correct subject of the claim. Often, the summary contains partial matches, and the actual required entity (e.g., \"Toby Kebbell\" or \"Mariqueen Maandig\") is still missing. Frame your query to explore the source or group (e.g., the full cast of a specific film, or the full list of producers) rather than anchoring strictly to the entity guessed in the summary.\n3. **Avoid Yes/No Questions:** Do not formulate your query as a conversational or closed-ended question (e.g., \"Did [Actor] act in [Film]?\"). Use concise, keyword-centric search phrases that are likely to match the text or title of an encyclopedia document.\n4. **Avoid Complex Boolean Logic:** Do not use complex operators like `AND`, `OR`, or excessive quotation marks. Overly complex Boolean queries often fail to match the required documents. \n5. **Use Specific Keywords from the Claim:** Ensure that the query incorporates the specific descriptive keywords from the claim used to identify the missing entity (e.g., \"Peter Rees entertainment program creator\", \"The Veteran 2011 film actor\", or \"An Omen EP producer singer\").\n\n### Output Format:\nProvide your response with the following fields:\n**reasoning**: Think step-by-step about what evidence is already available, what is missing, and how to best surface the remaining required documents without falling for distractor entities.\n**query**: A concise, keyword-based search query optimized to retrieve the missing evidence documents.", "create_query_hop3.predict": "Given the fields `claim`, `summary_1`, `summary_2`, produce the fields `reasoning` and `query`.\n\nYour task is to generate a search query that will successfully retrieve *all* required evidence documents to verify a multi-hop claim. The retrieval trajectory typically involves multiple documents (e.g., three hops), and your query must find every single required document in this trajectory, including starting nodes, intermediate \"bridge\" nodes, and final nodes.\n\nFollow these guidelines to formulate your query:\n1. **Include All Explicit Claim Entities and Concepts**: Deconstruct the claim into individual facts. Identify all explicit entities, descriptive phrases, and specialized concepts directly mentioned in the `claim` (e.g., \"NorthCap University\", \"Nicanor Tiongson\", \"Owen Wilson\", \"Tom Wu\", \"Asymptotic safety in quantum gravity\"). Ensure all of these key terms are present in your query.\n2. **Extract Bridge Entities from Summaries**: Identify intermediate or \"bridge\" entities mentioned in `summary_1` and `summary_2` that connect the facts in the claim (e.g., the film \"Shanghai Knights\" connecting two actors, or \"University of the Philippines\" connecting a person to their degree location). Add these bridge entities to your query.\n3. **Address Indirect Descriptions**: If the claim describes an entity indirectly (e.g., \"The Nobel Laureate in Physics known for his contributions with Abdus Salam\"), ensure your query contains enough information to retrieve all potential matching entities (e.g., Sheldon Lee Glashow or Steven Weinberg), even if the summaries only mention one or miss them entirely.\n4. **Always Generate a Query**: Even if the summaries are in complete agreement and fully verify the claim, you MUST generate a query. Your goal is to fetch the underlying evidence documents for the multi-hop trajectory, not just to answer or evaluate the claim. Never output \"No query needed\".\n5. **Comprehensive Query**: Combine all identified explicit entities, bridge entities, and key conceptual phrases into a broad, comprehensive search query (or string of keywords) that will surface every required document.\n\nProvide your output strictly using the following format:\nreasoning: <Step-by-step reasoning identifying the explicit entities in the claim, the intermediate bridge entities from the summaries, and any missing links needed to cover all hops>\nquery: <A comprehensive search query containing all necessary keywords and entity names>", "summarize1.predict": "Given the fields `claim` and `passages`, produce the fields `reasoning` and `summary`.\n\nYour task is to verify the `claim` by analyzing the provided `passages`. To do this successfully, you must explicitly construct and follow a \"three-hop retrieval trajectory\" to ensure every required evidence document is identified and checked.\n\n**Task Instructions and Generalizable Strategy:**\n1. **Deconstruct the Claim into Three Hops**: Break the claim down into three distinct logical steps or entities that need verification. Complex claims in this task rely on a three-hop trajectory (e.g., Entity A -> Entity B -> Entity C).\n2. **Resolve Pronouns and Descriptive Phrases Correctly (Domain-Specific Knowledge)**:\n   - Pay strict attention to grammatical antecedents. If a claim says \"Subject A is known for Film B, which was inspired by a 1957 movie. It was directed by...\", the pronoun \"It\" refers to the most recently introduced entity (the 1957 movie), not Subject A or Film B. You must identify the specific required document for that 1957 movie (e.g., '12 angry men 1957 film').\n   - Decode domain-specific references carefully. For example, in comic book lore, \"the family of titles that [Story Arc] is part of\" refers to the overarching parent franchise (e.g., 'spiderman' for the Maximum Carnage arc), and groups like \"the Daredevils\" represent distinct required entities ('daredevils') rather than just a general series. \n3. **Identify Required Evidence Documents**: For each of the three hops, determine the exact entity or topic required to verify that part of the claim. These act as search queries or article titles (e.g., 'county cork', 'education in cork', 'national maritime college of ireland').\n4. **Cross-Reference with Passages**: Evaluate whether the provided `passages` actually contain all the required evidence documents necessary to complete the three-hop trajectory. \n5. **Generate Output**:\n   - `reasoning`: Write out your step-by-step logical trajectory. Explicitly state the required evidence documents for each hop, accurately resolve all pronouns and phrases, and explicitly list any **missing required evidence documents** that prevent you from fully verifying the claim.\n   - `summary`: Provide a concise final verdict on whether the claim is accurate, inaccurate, or unverifiable due to missing evidence.", "summarize2.predict": "You are an expert fact-checking assistant specialized in the entertainment domain (including movies, television, documentaries, music history, voice actors, directors, and chart performances). \n\nYou will receive the following fields as input:\n- `claim`: A complex, multi-hop (typically three-hop) factual statement.\n- `context`: An authoritative summary of facts relevant to the claim.\n- `passages`: A list of retrieved reference documents (e.g., Wikipedia excerpts).\n\nYour task is to evaluate the accuracy of the `claim` by tracing its three-hop reasoning trajectory. Because you are verifying multi-hop claims, you must synthesize information across both the `context` and the `passages`. \n\nYou must adopt the following generalizable strategy and structure your response using exactly these two fields:\n\n1. `reasoning`: \n   - Perform a step-by-step logical deduction, breaking down the claim into its individual hops.\n   - Verify each hop against the provided `context` and `passages`. Note that sometimes required information missing from the `passages` may be present in the `context`, which you should treat as valid retrieved evidence.\n   - You must evaluate if the three-hop retrieval trajectory successfully found every required evidence document. Explicitly list the supporting entities/documents under \"Retrieved required evidence documents\" (format these as normalized, lowercase Wikipedia-style titles, e.g., ['catherine ohara', 'charlie tahan', 'frankenweenie 2012 film'] or ['billie anthony', 'shakin stevens', 'this ole house']).\n   - If any hop of the claim cannot be verified because the information is completely absent from both the `context` and `passages`, explicitly list the missing entities/documents under \"Missing required evidence documents\" (e.g., ['aliens of deep']). Explain how this absence impacts the verification.\n\n2. `summary`: \n   - Provide a concise final verdict stating whether the claim is accurate, inaccurate, or cannot be fully verified.\n   - Summarize the corrected or verified facts based on the available evidence.\n   - If applicable, reiterate what missing information prevents full verification of the claim's comparisons or statements."}},

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
